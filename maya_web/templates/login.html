<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya Tekstil — Giriş</title>
<style>
  :root {
    --bg:      #060A10;
    --card:    #0C1320;
    --border:  #1A2740;
    --accent:  #F57C37;
    --accent2: #FB9D62;
    --text:    #E8F0FE;
    --text2:   #8BA3CC;
    --text3:   #4A6080;
    --rose:    #F43F5E;
    --emerald: #10B981;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }

  /* Animated gradient orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.25;
    pointer-events: none;
  }
  .orb-1 { width:480px; height:480px; background:radial-gradient(circle, #F57C37 0%, transparent 70%); top:-120px; right:-100px; animation: float1 12s ease-in-out infinite; }
  .orb-2 { width:380px; height:380px; background:radial-gradient(circle, #6366F1 0%, transparent 70%); bottom:-80px; left:-80px;  animation: float2 15s ease-in-out infinite; }
  .orb-3 { width:300px; height:300px; background:radial-gradient(circle, #10B981 0%, transparent 70%); top:50%;     left:50%;    transform:translate(-50%,-50%); animation: float3 10s ease-in-out infinite; }

  @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,40px)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,-30px)} }
  @keyframes float3 { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.15)} }

  .card {
    position: relative;
    width: min(420px, 94vw);
    background: rgba(12, 19, 32, 0.85);
    border: 1px solid rgba(245, 124, 55, 0.18);
    border-radius: 20px;
    padding: 48px 40px;
    backdrop-filter: blur(24px);
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
    animation: slideUp .5s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes slideUp {
    from { opacity:0; transform:translateY(32px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .logo {
    text-align: center;
    margin-bottom: 36px;
  }
  .logo-mark {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    line-height: 1;
  }
  .logo-sub {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text3);
    text-transform: uppercase;
    margin-top: 6px;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(245,124,55,.35), transparent);
    margin-bottom: 36px;
  }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    padding: 12px 16px;
    outline: none;
    transition: border-color .2s, background .2s;
  }
  .field input:focus {
    border-color: rgba(245,124,55,.5);
    background: rgba(245,124,55,.05);
  }

  .error-box {
    background: rgba(244,63,94,.10);
    border: 1px solid rgba(244,63,94,.28);
    border-radius: 8px;
    color: #F87F97;
    font-size: 13px;
    padding: 10px 14px;
    margin-bottom: 18px;
  }

  .btn-login {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 14px;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    margin-top: 6px;
  }
  .btn-login:hover  { opacity: .88; }
  .btn-login:active { transform: scale(.98); }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--text3);
    margin-top: 28px;
    letter-spacing: .5px;
  }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="card">
  <div class="logo">
    <div class="logo-mark">MAYA</div>
    <div class="logo-sub">Tekstil — Kalan İzleme</div>
  </div>
  <div class="divider"></div>

  {% if error %}
  <div class="error-box">⚠ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="field">
      <label>Kullanıcı Adı</label>
      <input type="text" name="username" autocomplete="username"
             placeholder="kullanici_adi" autofocus required>
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" name="password" autocomplete="current-password"
             placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login">GİRİŞ YAP</button>
  </form>

  <p class="footer-note">Maya Tekstil San. ve Tic. Ltd. Şti.</p>
</div>

</body>
</html>
